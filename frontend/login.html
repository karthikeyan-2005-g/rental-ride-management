<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - RentalCars</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen
             bg-gradient-to-br
             from-blue-600
             to-blue-900
             flex items-center
             justify-center
             px-6">


    <!-- Login Card -->

    <div class="w-full max-w-md
                bg-white
                rounded-2xl
                shadow-2xl
                p-8">


        <!-- Logo -->

        <div class="text-center mb-8">

            <div class="text-5xl mb-3">
                🚗
            </div>

            <h1 class="text-3xl font-bold">
                Welcome Back
            </h1>

            <p class="text-gray-500 mt-2">
                Login to your RentalCars account
            </p>

        </div>



        <!-- Login Form -->

        <form id="loginForm">


            <!-- Username -->

            <div class="mb-5">

                <label class="block
                              font-semibold
                              mb-2">

                    Username

                </label>


                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                    class="w-full
                           border
                           border-gray-300
                           rounded-lg
                           px-4 py-3
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500">

            </div>



            <!-- Password -->

            <div class="mb-5">

                <label class="block
                              font-semibold
                              mb-2">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    class="w-full
                           border
                           border-gray-300
                           rounded-lg
                           px-4 py-3
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500">

            </div>



            <!-- Remember -->

            <div class="flex
                        items-center
                        mb-6">

                <input
                    type="checkbox"
                    class="w-4 h-4">


                <label class="ml-2
                              text-gray-600">

                    Remember me

                </label>

            </div>



            <!-- Login Button -->

            <button
                type="submit"
                class="w-full
                       bg-blue-600
                       hover:bg-blue-700
                       text-white
                       py-3
                       rounded-lg
                       font-bold
                       transition">

                Login

            </button>

        </form>



        <!-- Register -->

        <p class="text-center
                  text-gray-600
                  mt-6">

            Don't have an account?

            <a href="./resiter.html"
               class="text-blue-600
                      font-semibold
                      hover:underline">

                Create Account

            </a>

        </p>



        <!-- Back Home -->

        <div class="text-center mt-5">

            <a href="../index.html"
               class="text-gray-500
                      hover:text-blue-600">

                ← Back to Home

            </a>

        </div>

    </div>



    <!-- ==========================================
         CUSTOM ALERT MODAL
         ========================================== -->

    <div id="alertModal"
         class="fixed inset-0
                bg-black bg-opacity-50
                hidden
                items-center
                justify-center
                z-50
                px-4">


        <div class="bg-white
                    w-full
                    max-w-md
                    rounded-2xl
                    shadow-2xl
                    p-7
                    text-center
                    transform
                    transition-all">


            <!-- Alert Icon -->

            <div id="alertIcon"
                 class="w-16 h-16
                        mx-auto
                        rounded-full
                        bg-red-100
                        flex
                        items-center
                        justify-center
                        text-3xl
                        mb-5">

                ⚠️

            </div>



            <!-- Alert Title -->

            <h2 id="alertTitle"
                class="text-2xl
                       font-bold
                       text-gray-800">

                Login Failed

            </h2>



            <!-- Alert Message -->

            <p id="alertMessage"
               class="text-gray-500
                      mt-3
                      leading-relaxed">

                Invalid username or password.

            </p>



            <!-- OK Button -->

            <button
                id="alertOkButton"
                type="button"
                class="mt-6
                       px-8
                       py-3
                       bg-blue-600
                       hover:bg-blue-700
                       text-white
                       rounded-lg
                       font-semibold
                       transition">

                OK

            </button>

        </div>

    </div>



    <!-- JavaScript -->

    <script>


        const API_URL =
            "http://127.0.0.1:8000";



        // ==========================================
        // CUSTOM ALERT FUNCTION
        // ==========================================

        function showAlert(
            title,
            message,
            type = "error",
            callback = null
        ) {


            const modal =
                document.getElementById(
                    "alertModal"
                );


            const icon =
                document.getElementById(
                    "alertIcon"
                );


            const alertTitle =
                document.getElementById(
                    "alertTitle"
                );


            const alertMessage =
                document.getElementById(
                    "alertMessage"
                );


            const okButton =
                document.getElementById(
                    "alertOkButton"
                );



            // ==========================================
            // ERROR STYLE
            // ==========================================

            if (type === "error") {

                icon.innerHTML = "⚠️";

                icon.className =
                    "w-16 h-16 mx-auto rounded-full " +
                    "bg-red-100 text-red-600 " +
                    "flex items-center justify-center " +
                    "text-3xl mb-5";


                okButton.className =
                    "mt-6 px-8 py-3 " +
                    "bg-red-600 hover:bg-red-700 " +
                    "text-white rounded-lg " +
                    "font-semibold transition";

            }



            // ==========================================
            // SUCCESS STYLE
            // ==========================================

            else if (type === "success") {

                icon.innerHTML = "✓";

                icon.className =
                    "w-16 h-16 mx-auto rounded-full " +
                    "bg-green-100 text-green-600 " +
                    "flex items-center justify-center " +
                    "text-3xl font-bold mb-5";


                okButton.className =
                    "mt-6 px-8 py-3 " +
                    "bg-green-600 hover:bg-green-700 " +
                    "text-white rounded-lg " +
                    "font-semibold transition";

            }



            // Set text

            alertTitle.innerText =
                title;


            alertMessage.innerText =
                message;



            // Show modal

            modal.classList.remove(
                "hidden"
            );

            modal.classList.add(
                "flex"
            );



            // OK button

            okButton.onclick =
                function () {


                    modal.classList.add(
                        "hidden"
                    );


                    modal.classList.remove(
                        "flex"
                    );


                    if (callback) {

                        callback();

                    }

                };

        }



        // ==========================================
        // LOGIN FORM
        // ==========================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {


                    event.preventDefault();



                    // Get username

                    const username =
                        document
                            .getElementById(
                                "username"
                            )
                            .value
                            .trim();



                    // Get password

                    const password =
                        document
                            .getElementById(
                                "password"
                            )
                            .value;



                    // ==========================================
                    // BASIC VALIDATION
                    // ==========================================

                    if (!username || !password) {

                        showAlert(
                            "Missing Information",
                            "Please enter username and password.",
                            "error"
                        );

                        return;

                    }



                    try {


                        // ==========================================
                        // DJANGO LOGIN API
                        // ==========================================

                        const response =
                            await fetch(

                                API_URL +
                                "/api/login/",

                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body: JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            password

                                    })

                                }

                            );



                        // Get response

                        const result =
                            await response.json();



                        // ==========================================
                        // LOGIN SUCCESSFUL
                        // ==========================================

                        if (response.ok) {


                            // Save user ID

                            localStorage.setItem(
                                "user_id",
                                result.user_id
                            );



                            // Save username

                            localStorage.setItem(
                                "user_name",
                                result.username
                            );



                            // Save email

                            localStorage.setItem(
                                "user_email",
                                result.email
                            );



                            // Custom success popup

                            showAlert(
                                "Login Successful!",
                                "Welcome back, " +
                                result.username +
                                "! You have successfully logged in.",
                                "success",

                                function () {

                                    // Go to home page

                                    window.location.href =
                                        "../index.html";

                                }

                            );

                        }



                        // ==========================================
                        // LOGIN FAILED
                        // ==========================================

                        else {


                            showAlert(

                                "Login Failed",

                                result.detail ||
                                "Invalid username or password.",

                                "error"

                            );

                        }

                    }



                    // ==========================================
                    // SERVER ERROR
                    // ==========================================

                    catch (error) {


                        console.error(
                            "Login Error:",
                            error
                        );


                        showAlert(

                            "Connection Error",

                            "Unable to connect to Django server. " +
                            "Please make sure Django server is running.",

                            "error"

                        );

                    }

                }

            );

    </script>


</body>

</html>
