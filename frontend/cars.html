<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Available Cars - RentalCars</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

<!-- ================= NAVBAR ================= -->

<nav class="bg-gray-950 text-white shadow-lg">

    <div class="max-w-7xl mx-auto px-6">

        <div class="flex items-center justify-between h-20">

            <a href="../index.html"
               class="text-2xl font-bold">
                🚗 RentalCars
            </a>

            <div class="hidden md:flex items-center gap-8">

                <a href="../index.html"
                   class="hover:text-green-400">
                    Home
                </a>

                <a href="./cars.html"
                   class="text-green-400 font-semibold">
                    Cars
                </a>

                <a href="./my_bookings.html"
                   class="hover:text-green-400">
                    My Bookings
                </a>
                <a href="./contact_support.html"
                     class="hover:text-green-400 transition">

                    Contact & Support</a> 

                <a href="./login.html"
                   class="bg-green-500 hover:bg-green-600
                          px-5 py-2.5 rounded-lg
                          font-semibold">
                    Login
                </a>

            </div>

        </div>

    </div>

</nav>


<!-- ================= HEADER ================= -->

<section class="bg-gradient-to-r from-blue-600 to-blue-800 text-white">

    <div class="max-w-7xl mx-auto px-6 py-14">

        <h1 class="text-4xl md:text-5xl font-bold">
            Available Cars
        </h1>

        <p class="mt-3 text-blue-100">
            Choose the perfect car for your journey.
        </p>

    </div>

</section>


<!-- ================= SEARCH & FILTER ================= -->

<section class="max-w-7xl mx-auto px-6 py-10">

    <div class="bg-white p-6 rounded-2xl shadow-md">

        <div class="grid md:grid-cols-3 gap-4">

            <!-- Search -->

            <div>

                <label class="block font-semibold mb-2">
                    Search Car
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by brand or name..."
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-3
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500">

            </div>


            <!-- Type -->

            <div>

                <label class="block font-semibold mb-2">
                    Car Type
                </label>

                <select
                    id="typeFilter"
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-3">

                    <option value="all">
                        All Types
                    </option>

                    <option value="sedan">
                        Sedan
                    </option>

                    <option value="suv">
                        SUV
                    </option>

                    <option value="hatchback">
                        Hatchback
                    </option>

                    <option value="luxury">
                        Luxury
                    </option>

                </select>

            </div>


            <!-- Price -->

            <div>

                <label class="block font-semibold mb-2">
                    Maximum Price / Day
                </label>

                <select
                    id="priceFilter"
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-3">

                    <option value="all">
                        Any Price
                    </option>

                    <option value="2000">
                        Under ₹2,000
                    </option>

                    <option value="3000">
                        Under ₹3,000
                    </option>

                    <option value="5000">
                        Under ₹5,000
                    </option>

                </select>

            </div>

        </div>

    </div>

</section>


<!-- ================= CARS ================= -->

<section class="max-w-7xl mx-auto px-6 pb-20">

    <div class="flex justify-between items-center mb-8">

        <h2 class="text-2xl font-bold">
            Our Cars
        </h2>

        <span id="carCount"
              class="text-gray-500">
            Loading cars...
        </span>

    </div>


    <!-- Cars will come from Django -->

    <div id="carContainer"
         class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
    </div>


    <!-- NO RESULTS -->

    <div id="noResults"
         class="hidden text-center py-16">

        <div class="text-6xl">
            🚗
        </div>

        <h3 class="text-2xl font-bold mt-4">
            No Cars Found
        </h3>

        <p class="text-gray-500 mt-2">
            Try changing your search or filter.
        </p>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer class="bg-gray-950 text-gray-400 py-8">

    <div class="text-center">

        <p>
            © 2026 Rental Car Management System
        </p>

    </div>

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script>

const API_URL = "http://127.0.0.1:8000/api/cars/";

const searchInput = document.getElementById("searchInput");
const typeFilter = document.getElementById("typeFilter");
const priceFilter = document.getElementById("priceFilter");

const carContainer = document.getElementById("carContainer");
const carCount = document.getElementById("carCount");
const noResults = document.getElementById("noResults");

let allCars = [];


/* ==========================================
   LOAD CARS FROM DJANGO BACKEND
========================================== */

async function loadCars() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Failed to load cars");
        }

        allCars = await response.json();

        displayCars(allCars);

    } catch (error) {

        console.error("Error:", error);

        carContainer.innerHTML = `
            <div class="col-span-full text-center py-10">

                <h3 class="text-2xl font-bold text-red-600">
                    Unable to load cars
                </h3>

                <p class="text-gray-500 mt-2">
                    Please make sure Django backend is running.
                </p>

            </div>
        `;

        carCount.innerText = "0 Cars Available";
    }

}


/* ==========================================
   DISPLAY CARS
========================================== */

function displayCars(cars) {

    carContainer.innerHTML = "";

    carCount.innerText =
        cars.length + " Cars Available";


    if (cars.length === 0) {

        noResults.classList.remove("hidden");

        return;
    }

    noResults.classList.add("hidden");


    cars.forEach(function(car) {

        const card = document.createElement("div");

        card.className =
            "car-card bg-white rounded-2xl " +
            "overflow-hidden shadow-md " +
            "hover:shadow-xl transition";


        card.innerHTML = `

            <!-- CAR IMAGE -->

            <div class="h-52 overflow-hidden">

                <img
                    src="images/${car.image}"
                    alt="${car.name}"
                    class="w-full h-full object-cover"
                    onerror="this.src='images/car-placeholder.jpg'"
                >

            </div>


            <!-- CAR DETAILS -->

            <div class="p-6">

                <div class="flex justify-between">

                    <div>

                        <h3 class="text-xl font-bold">
                            ${car.name}
                        </h3>

                        <p class="text-gray-500">
                            ${car.type}
                        </p>

                        <span class="
                            inline-block
                            bg-green-100
                            text-green-700
                            text-xs
                            px-3 py-1
                            rounded-full
                            mt-2">

                            ${car.available
                                ? "Available"
                                : "Not Available"}

                        </span>

                    </div>

                </div>


                <!-- SEATS / TRANSMISSION -->

                <div class="flex justify-between mt-5">

                    <span class="text-gray-500">
                        👤 ${car.seats} Seats
                    </span>

                    <span class="text-gray-500">
                        ⚙ ${car.transmission}
                    </span>

                </div>


                <!-- PRICE -->

                <div class="
                    border-t
                    mt-5
                    pt-5
                    flex
                    justify-between
                    items-center">

                    <div>

                        <span class="
                            text-2xl
                            font-bold
                            text-blue-600">

                            ₹${Number(car.price_per_day)
                                .toLocaleString("en-IN")}

                        </span>

                        <span class="text-gray-500">
                            /day
                        </span>

                    </div>


                    <!-- BOOKING -->

                    <a
                        href="booking.html?car_id=${car.id}&car=${encodeURIComponent(car.name)}&price=${car.price_per_day}"
                        class="
                            bg-blue-600
                            hover:bg-blue-700
                            text-white
                            px-5 py-2.5
                            rounded-lg
                            font-semibold">

                        Rent Now

                    </a>

                </div>

            </div>
        `;


        carContainer.appendChild(card);

    });

}


/* ==========================================
   FILTER CARS
========================================== */

function filterCars() {

    const search =
        searchInput.value.toLowerCase().trim();

    const type =
        typeFilter.value;

    const maxPrice =
        priceFilter.value;


    const filteredCars = allCars.filter(function(car) {

        const name =
            car.name.toLowerCase();

        const brand =
            car.brand.toLowerCase();


        const searchMatch =
            name.includes(search) ||
            brand.includes(search);


        const typeMatch =
            type === "all" ||
            car.type.toLowerCase() === type;


        const priceMatch =
            maxPrice === "all" ||
            Number(car.price_per_day) <= Number(maxPrice);


        return searchMatch &&
               typeMatch &&
               priceMatch;

    });


    displayCars(filteredCars);

}


/* ==========================================
   EVENTS
========================================== */

searchInput.addEventListener(
    "input",
    filterCars
);

typeFilter.addEventListener(
    "change",
    filterCars
);

priceFilter.addEventListener(
    "change",
    filterCars
);


/* ==========================================
   START
========================================== */

loadCars();

</script>

</body>
</html>
