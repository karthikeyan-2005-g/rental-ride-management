<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings - RentalCars</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen">


    <!-- Navbar -->

    <nav class="bg-white shadow-md">

        <div class="max-w-7xl mx-auto px-6 py-4
                    flex justify-between items-center">

            <a href="../index.html"
               class="text-2xl font-bold text-blue-600">

                🚗 CarRental

            </a>


            <div class="flex gap-6 items-center">

                <a href="../index.html"
                   class="text-gray-700 hover:text-blue-600">

                    Home

                </a>


                <a href="./cars.html"
                   class="text-gray-700 hover:text-blue-600">

                    Cars

                </a>


                <a href="./my_bookings.html"
                   class="text-blue-600 font-semibold">

                    My Bookings

                </a>

                <a href="./contact_support.html"
                     class="hover:text-green-400 transition">

                    Contact & Support</a> 


                <a href="./login.html"
                   class="text-gray-700 hover:text-blue-600">

                    Login

                </a>

            </div>

        </div>

    </nav>



    <!-- Page Header -->

    <section class="bg-blue-600 text-white py-12">

        <div class="max-w-7xl mx-auto px-6">

            <h1 class="text-4xl font-bold">

                My Bookings

            </h1>


            <p class="mt-2 text-blue-100">

                View your car rental bookings

            </p>

        </div>

    </section>



    <!-- Bookings -->

    <main class="max-w-7xl mx-auto px-6 py-10">


        <!-- No Bookings -->

        <div id="noBookings"
             class="bg-white rounded-xl shadow-md
                    p-10 text-center">

            <div class="text-6xl mb-4">

                🚗

            </div>


            <h2 class="text-2xl font-bold text-gray-800">

                No Bookings Found

            </h2>


            <p class="text-gray-500 mt-2">

                You haven't booked any cars yet.

            </p>


            <a href="./cars.html"
               class="inline-block mt-6
                      bg-blue-600 text-white
                      px-6 py-3 rounded-lg
                      hover:bg-blue-700">

                Browse Cars

            </a>

        </div>



        <!-- Booking Container -->

        <div id="bookingContainer"
             class="space-y-6 hidden">

        </div>

    </main>



    <!-- Footer -->

    <footer class="bg-gray-900 text-white py-6 mt-10">

        <div class="max-w-7xl mx-auto px-6 text-center">

            <p>

                © 2026 RentalCars. All rights reserved.

            </p>

        </div>

    </footer>



    <script>

        // ==========================================
        // DJANGO BACKEND
        // ==========================================

        const API_URL = "http://127.0.0.1:8000";


        // ==========================================
        // GET LOGGED-IN USER
        // ==========================================

        const userId = localStorage.getItem("user_id");

        console.log("Logged in User ID:", userId);


        const bookingContainer =
            document.getElementById("bookingContainer");


        const noBookings =
            document.getElementById("noBookings");



        // ==========================================
        // LOAD CAR DETAILS
        // ==========================================

        async function getCars() {

            try {

                const response =
                    await fetch(
                        API_URL + "/api/cars/"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load cars"
                    );

                }


                return await response.json();

            }

            catch (error) {

                console.error(
                    "Car Error:",
                    error
                );

                return [];

            }

        }



        // ==========================================
        // LOAD BOOKINGS
        // ==========================================

        async function loadBookings() {


            // User not logged in

            if (!userId) {

                noBookings.classList.remove("hidden");

                bookingContainer.classList.add("hidden");

                return;

            }



            try {


                // Get user bookings

                const response =
                    await fetch(
                        API_URL +
                        "/api/bookings/user/" +
                        userId +
                        "/"
                    );



                if (!response.ok) {

                    throw new Error(
                        "Failed to load bookings"
                    );

                }



                const bookings =
                    await response.json();



                // ==========================================
                // REMOVE CANCELLED BOOKINGS
                // ==========================================

                const activeBookings =
                    bookings.filter(function(booking) {

                        return booking.status !== "Cancelled";

                    });



                // ==========================================
                // NO ACTIVE BOOKINGS
                // ==========================================

                if (activeBookings.length === 0) {

                    noBookings.classList.remove("hidden");

                    bookingContainer.classList.add("hidden");

                    bookingContainer.innerHTML = "";

                    return;

                }



                // ==========================================
                // SHOW BOOKINGS
                // ==========================================

                noBookings.classList.add("hidden");

                bookingContainer.classList.remove("hidden");

                bookingContainer.innerHTML = "";



                // ==========================================
                // GET CAR DATA
                // ==========================================

                const cars = await getCars();



                // ==========================================
                // DISPLAY EACH BOOKING
                // ==========================================

                activeBookings.forEach(function(booking) {


                    // Find car using booking.car ID

                    const car =
                        cars.find(function(carItem) {

                            return carItem.id === booking.car;

                        });



                    const carName =
                        car
                            ? car.name
                            : "Car ID: " + booking.car;



                    const bookingCard =
                        document.createElement("div");



                    bookingCard.className =
                        "bg-white rounded-xl shadow-md p-6";



                    bookingCard.innerHTML = `

                        <div class="flex flex-col
                                    md:flex-row
                                    justify-between
                                    gap-6">


                            <div>

                                <h2 class="text-2xl
                                           font-bold
                                           text-gray-800">

                                    ${carName}

                                </h2>


                                <p class="text-gray-500 mt-1">

                                    Booking ID:
                                    #${booking.id}

                                </p>

                            </div>



                            <div>

                                <span class="bg-green-100
                                             text-green-700
                                             px-4 py-2
                                             rounded-full
                                             text-sm
                                             font-semibold">

                                    ${booking.status}

                                </span>

                            </div>


                        </div>



                        <!-- Booking Details -->

                        <div class="grid
                                    grid-cols-1
                                    md:grid-cols-2
                                    lg:grid-cols-4
                                    gap-6 mt-6">


                            <!-- Pickup Date -->

                            <div>

                                <p class="text-gray-500 text-sm">

                                    Pickup Date

                                </p>


                                <p class="font-semibold
                                          text-gray-800">

                                    ${booking.pickup_date}

                                </p>

                            </div>



                            <!-- Return Date -->

                            <div>

                                <p class="text-gray-500 text-sm">

                                    Return Date

                                </p>


                                <p class="font-semibold
                                          text-gray-800">

                                    ${booking.return_date}

                                </p>

                            </div>



                            <!-- Pickup Location -->

                            <div>

                                <p class="text-gray-500 text-sm">

                                    Pickup Location

                                </p>


                                <p class="font-semibold
                                          text-gray-800">

                                    ${booking.pickup_location ||
                                      "Not available"}

                                </p>

                            </div>



                            <!-- Total Amount -->

                            <div>

                                <p class="text-gray-500 text-sm">

                                    Total Amount

                                </p>


                                <p class="font-bold
                                          text-blue-600
                                          text-lg">

                                    ₹${Number(
                                        booking.total_price || 0
                                    ).toLocaleString("en-IN")}

                                </p>

                            </div>


                        </div>



                        <!-- Customer Details -->

                        <div class="border-t
                                    mt-6
                                    pt-4">


                            <p class="text-gray-500 text-sm">

                                Customer

                            </p>


                            <p class="font-semibold">

                                ${booking.customer_name ||
                                  "Customer"}

                            </p>


                            <p class="text-gray-500 text-sm mt-1">

                                ${booking.email || ""}

                            </p>


                            <p class="text-gray-500 text-sm mt-1">

                                ${booking.phone || ""}

                            </p>


                        </div>



                        <!-- Cancel Button -->

                        <div class="mt-5">


                            <button
                                onclick="cancelBooking(${booking.id})"

                                class="bg-red-600
                                       text-white
                                       px-6 py-3
                                       rounded-lg
                                       hover:bg-red-700
                                       font-semibold">

                                Cancel Booking

                            </button>


                        </div>

                    `;



                    bookingContainer.appendChild(
                        bookingCard
                    );


                });


            }


            catch (error) {


                console.error(
                    "Booking Error:",
                    error
                );


                noBookings.classList.remove(
                    "hidden"
                );


                bookingContainer.classList.add(
                    "hidden"
                );


            }

        }



        // ==========================================
        // CANCEL BOOKING
        // ==========================================

        async function cancelBooking(bookingId) {


            const confirmCancel =
                confirm(
                    "Are you sure you want to cancel this booking?"
                );


            if (!confirmCancel) {

                return;

            }



            try {


                const response =
                    await fetch(

                        API_URL +
                        "/api/bookings/" +
                        bookingId +
                        "/",

                        {

                            method: "DELETE"

                        }

                    );



                const result =
                    await response.json();



                if (response.ok) {


                    alert(
                        "Booking cancelled successfully!"
                    );



                    // Reload bookings

                    loadBookings();


                }

                else {


                    alert(

                        result.detail ||
                        result.error ||
                        "Failed to cancel booking."

                    );

                }


            }


            catch (error) {


                console.error(
                    "Cancel Error:",
                    error
                );


                alert(
                    "Unable to connect to Django backend."
                );


            }

        }



        // ==========================================
        // LOAD BOOKINGS WHEN PAGE OPENS
        // ==========================================

        loadBookings();

    </script>


</body>

</html>
