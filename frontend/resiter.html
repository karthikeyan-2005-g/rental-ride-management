<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - RentalCars</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen">


    <!-- Navbar -->

    <nav class="bg-gray-950 text-white shadow-lg">

        <div class="max-w-7xl mx-auto px-6 h-20
                    flex items-center justify-between">


            <a href="../index.html"
               class="text-2xl font-bold">

                🚗RentalCars

            </a>


            <div class="flex gap-6">

                <a href="../index.html"
                   class="hover:text-green-400">

                    Home

                </a>


                <a href="./cars.html"
                   class="hover:text-green-400">

                    Cars

                </a>


                <a href="./login.html"
                   data-auth-control
                   data-login-url="./login.html"
                   class="hover:text-green-400">

                    Login

                </a>

            </div>

        </div>

    </nav>

    <script src="./auth-nav.js"></script>



    <!-- Register Section -->

    <div class="min-h-[calc(100vh-80px)]
                flex items-center
                justify-center
                px-4">


        <div class="bg-white
                    w-full max-w-md
                    rounded-2xl
                    shadow-xl
                    p-8">


            <h1 class="text-3xl
                       font-bold
                       text-center
                       text-gray-900
                       mb-2">

                Create Account

            </h1>


            <p class="text-center
                      text-gray-500
                      mb-8">

                Register for your RentalCars account

            </p>



            <!-- Register Form -->

            <form id="registerForm">


                <!-- Username -->

                <div class="mb-5">

                    <label class="block
                                  text-gray-700
                                  font-semibold
                                  mb-2">

                        Username

                    </label>


                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                        class="w-full
                               px-4 py-3
                               border
                               border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-green-500">

                </div>



                <!-- Email -->

                <div class="mb-5">

                    <label class="block
                                  text-gray-700
                                  font-semibold
                                  mb-2">

                        Email Address

                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                        class="w-full
                               px-4 py-3
                               border
                               border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-green-500">

                </div>



                <!-- Password -->

                <div class="mb-5">

                    <label class="block
                                  text-gray-700
                                  font-semibold
                                  mb-2">

                        Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        class="w-full
                               px-4 py-3
                               border
                               border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-green-500">

                </div>



                <!-- Confirm Password -->

                <div class="mb-6">

                    <label class="block
                                  text-gray-700
                                  font-semibold
                                  mb-2">

                        Confirm Password

                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                        class="w-full
                               px-4 py-3
                               border
                               border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-green-500">

                </div>



                <!-- Register Button -->

                <button
                    type="submit"
                    class="w-full
                           bg-green-600
                           hover:bg-green-700
                           text-white
                           font-bold
                           py-3
                           rounded-lg
                           transition
                           duration-200">

                    Create Account

                </button>

            </form>



            <!-- Login Link -->

            <p class="text-center
                      text-gray-600
                      mt-6">

                Already have an account?

                <a href="./login.html"
                   class="text-green-600
                          font-semibold
                          hover:underline">

                    Login

                </a>

            </p>

        </div>

    </div>



    <!-- ==========================================
         CUSTOM ALERT MODAL
         ========================================== -->

    <div id="alertModal"
         class="fixed inset-0
                bg-black bg-opacity-50
                hidden
                items-center
                justify-center
                z-50
                px-4">


        <div class="bg-white
                    w-full
                    max-w-md
                    rounded-2xl
                    shadow-2xl
                    p-7
                    text-center">


            <!-- Alert Icon -->

            <div id="alertIcon"
                 class="w-16 h-16
                        mx-auto
                        rounded-full
                        bg-red-100
                        text-red-600
                        flex
                        items-center
                        justify-center
                        text-3xl
                        mb-5">

                ⚠️

            </div>



            <!-- Alert Title -->

            <h2 id="alertTitle"
                class="text-2xl
                       font-bold
                       text-gray-800">

                Registration Failed

            </h2>



            <!-- Alert Message -->

            <p id="alertMessage"
               class="text-gray-500
                      mt-3
                      leading-relaxed">

                Registration failed.

            </p>



            <!-- OK Button -->

            <button
                id="alertOkButton"
                type="button"
                class="mt-6
                       px-8
                       py-3
                       bg-red-600
                       hover:bg-red-700
                       text-white
                       rounded-lg
                       font-semibold
                       transition">

                OK

            </button>

        </div>

    </div>



    <!-- JavaScript -->

    <script>


        const API_URL =
            "http://127.0.0.1:8000";



        // ==========================================
        // CUSTOM ALERT FUNCTION
        // ==========================================

        function showAlert(
            title,
            message,
            type = "error",
            callback = null
        ) {


            const modal =
                document.getElementById(
                    "alertModal"
                );


            const icon =
                document.getElementById(
                    "alertIcon"
                );


            const alertTitle =
                document.getElementById(
                    "alertTitle"
                );


            const alertMessage =
                document.getElementById(
                    "alertMessage"
                );


            const okButton =
                document.getElementById(
                    "alertOkButton"
                );



            // ==========================================
            // ERROR STYLE
            // ==========================================

            if (type === "error") {

                icon.innerHTML = "⚠️";

                icon.className =
                    "w-16 h-16 mx-auto rounded-full " +
                    "bg-red-100 text-red-600 " +
                    "flex items-center justify-center " +
                    "text-3xl mb-5";


                okButton.className =
                    "mt-6 px-8 py-3 " +
                    "bg-red-600 hover:bg-red-700 " +
                    "text-white rounded-lg " +
                    "font-semibold transition";

            }



            // ==========================================
            // SUCCESS STYLE
            // ==========================================

            else if (type === "success") {

                icon.innerHTML = "✓";

                icon.className =
                    "w-16 h-16 mx-auto rounded-full " +
                    "bg-green-100 text-green-600 " +
                    "flex items-center justify-center " +
                    "text-3xl font-bold mb-5";


                okButton.className =
                    "mt-6 px-8 py-3 " +
                    "bg-green-600 hover:bg-green-700 " +
                    "text-white rounded-lg " +
                    "font-semibold transition";

            }



            // Set text

            alertTitle.innerText =
                title;


            alertMessage.innerText =
                message;



            // Show modal

            modal.classList.remove(
                "hidden"
            );

            modal.classList.add(
                "flex"
            );



            // OK button

            okButton.onclick =
                function () {


                    modal.classList.add(
                        "hidden"
                    );


                    modal.classList.remove(
                        "flex"
                    );


                    if (callback) {

                        callback();

                    }

                };

        }



        // ==========================================
        // REGISTER FORM
        // ==========================================

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {


                    event.preventDefault();



                    // Get username

                    const username =
                        document
                            .getElementById(
                                "username"
                            )
                            .value
                            .trim();



                    // Get email

                    const email =
                        document
                            .getElementById(
                                "email"
                            )
                            .value
                            .trim();



                    // Get password

                    const password =
                        document
                            .getElementById(
                                "password"
                            )
                            .value;



                    // Get confirm password

                    const confirmPassword =
                        document
                            .getElementById(
                                "confirmPassword"
                            )
                            .value;



                    // ==========================================
                    // CHECK PASSWORD
                    // ==========================================

                    if (
                        password !==
                        confirmPassword
                    ) {

                        showAlert(
                            "Password Error",
                            "Passwords do not match.",
                            "error"
                        );

                        return;

                    }



                    // ==========================================
                    // PASSWORD LENGTH
                    // ==========================================

                    if (
                        password.length < 6
                    ) {

                        showAlert(
                            "Password Error",
                            "Password must be at least 6 characters.",
                            "error"
                        );

                        return;

                    }



                    try {


                        // ==========================================
                        // DJANGO REGISTER API
                        // ==========================================

                        const response =
                            await fetch(

                                API_URL +
                                "/api/register/",

                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body: JSON.stringify({

                                        username:
                                            username,

                                        email:
                                            email,

                                        password:
                                            password

                                    })

                                }

                            );



                        // Get backend response

                        const result =
                            await response.json();



                        // ==========================================
                        // REGISTRATION SUCCESSFUL
                        // ==========================================

                        if (response.ok) {


                            showAlert(

                                "Registration Successful!",
                                
                                "Your RentalCars account has been created successfully.",

                                "success",

                                function () {

                                    // Go to login page

                                    window.location.href =
                                        "login.html";

                                }

                            );

                        }



                        // ==========================================
                        // REGISTRATION FAILED
                        // ==========================================

                        else {


                            console.error(
                                "Registration Error:",
                                result
                            );



                            if (result.username) {

                                showAlert(

                                    "Username Error",

                                    "Username: " +
                                    result.username[0],

                                    "error"

                                );

                            }


                            else if (result.email) {

                                showAlert(

                                    "Email Error",

                                    "Email: " +
                                    result.email[0],

                                    "error"

                                );

                            }


                            else if (result.password) {

                                showAlert(

                                    "Password Error",

                                    "Password: " +
                                    result.password[0],

                                    "error"

                                );

                            }


                            else {

                                showAlert(

                                    "Registration Failed",

                                    "Registration failed.",

                                    "error"

                                );

                            }

                        }

                    }



                    // ==========================================
                    // SERVER / NETWORK ERROR
                    // ==========================================

                    catch (error) {


                        console.error(
                            "Registration Error:",
                            error
                        );


                        showAlert(

                            "Connection Error",

                            "Unable to connect to Django server. " +
                            "Please make sure Django server is running.",

                            "error"

                        );

                    }

                }

            );

    </script>


</body>

</html>
